# The marketplace profile: what `mason check`, `mason doctor` and `mason sync` hold a repo to.
# The rules themselves are in the chapters; README.md in this folder compares the profiles.
description = "A plugin marketplace index: a signed index.json built from the plugin repos' releases"
chapters = ["blocks/modules-and-plugins.md"]
files = ["AGENTS.md", "CLAUDE.md", "README.md", "LICENSE|LICENSE.md", "SECURITY.md|.github/SECURITY.md", "renovate.json|.github/renovate.json|renovate.json5", ".pre-commit-config.yaml", ".editorconfig", "plugins.yaml"]
labels = ["type:bug", "type:feature", "type:docs", "type:chore", "type:security", "prio:high", "prio:normal", "prio:low", "needs-triage", "good first issue", "blocked", "handbook"]
skills = ["pr-review", "security-review"]
