# The web-app profile: what `mason check`, `mason doctor` and `mason sync` hold a repo to.
# The rules themselves are in the chapters; README.md in this folder compares the profiles.
description = "A web app: API, database, jobs and a web frontend"
chapters = ["blocks/README.md", "blocks/modules-and-plugins.md", "blocks/ui-and-brand.md", "blocks/kubernetes.md"]
files = ["AGENTS.md", "CLAUDE.md", "README.md", "LICENSE|LICENSE.md", "SECURITY.md|.github/SECURITY.md", "renovate.json|.github/renovate.json|renovate.json5", "CHANGELOG.md|changelog.d", "Dockerfile"]
labels = ["type:bug", "type:feature", "type:docs", "type:chore", "prio:high", "prio:normal", "prio:low", "good first issue", "blocked"]
skills = ["release", "pr-review", "security-review", "new-migration", "new-plugin"]

[check]
fragments = "changelog.d"
migrations = true
