# The [handbook] table of an app repo's .mason.toml (Mason's per-repo settings file).
# Mason reads it: `mason check`, `mason doctor`, `mason sync` (skills) and `mason handbook`; `mason adopt` writes it.
[handbook]
repo = "bitsandbricks-ch/handbook"
profile = "web-app"   # web-app | api-only | desktop | mobile | static-site | cli-tool | multi-tool | agent | infra
version = "v1"
