apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: <app>-internal
  namespace: <app>
  labels:
    traefik-instance: internal       # required; Kyverno and CI reject routes without it
spec:
  entryPoints:
    - websecure
  routes:
    - match: Host(`<app>.${INTERNAL_DOMAIN}`)
      kind: Rule
      services:
        - name: <app>
          port: 80
  tls:
    secretName: <app>-internal-tls
