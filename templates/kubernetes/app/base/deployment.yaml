apiVersion: apps/v1
kind: Deployment
metadata:
  name: <app>
  namespace: <app>
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: <app>
  template:
    metadata:
      labels:
        app.kubernetes.io/name: <app>
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: <app>
          image: ghcr.io/<org>/<app>:<version>   # exact version or digest, never latest
          ports:
            - name: http
              containerPort: 8000
          env:
            - name: DATABASE_URL_FILE
              value: /run/secrets/<app>/database-url
          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            # no CPU limit on request-path workloads
          readinessProbe:
            httpGet: { path: /readyz, port: http }
          livenessProbe:
            httpGet: { path: /healthz, port: http }
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - { name: secrets, mountPath: /run/secrets/<app>, readOnly: true }
            - { name: tmp, mountPath: /tmp }
      volumes:
        - name: secrets
          secret:
            secretName: <app>
        - name: tmp
          emptyDir: {}
