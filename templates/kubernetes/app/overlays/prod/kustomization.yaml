# For <app>-<env> namespaces; a one-environment app uses base/ directly.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: <app>-prod
resources:
  - ../../base
patches:
  - target:
      kind: Namespace
    patch: |
      - op: replace
        path: /metadata/name
        value: <app>-prod
